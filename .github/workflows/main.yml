name: Build and Test Voronoi

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            build-essential make cmake \
            python3 python3-pip python3-pytest \
            python3-numpy
        python3 -m pip install --upgrade pip
        python3 -m pip install pybind11 scipy pytest

    # Verify pybind11 installation
    - name: Verify pybind11
      run: python3 -m pybind11 --includes

    # Build the project
    - name: Build project
      run: make

    # Run the tests
    - name: Run tests
      run: make test
